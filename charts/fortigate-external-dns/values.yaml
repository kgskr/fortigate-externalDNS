replicaCount: 1

image:
  repository: ghcr.io/gilsu/fortigate-external-dns
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

sources:
  - service
  - ingress
  - gateway

namespaces: []
domainFilters: []
ownerID: fortigate-external-dns
defaultTTL: 300
dryRun: true
once: false
interval: 1m
cleanupPolicy: delete

fortigate:
  url: ""
  zone: ""
  vdom: root
  existingSecret: ""
  apiTokenSecretKey: api-token
  insecureSkipVerify: false
  timeout: 15s
  retries: 2

podAnnotations: {}
podLabels: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 65532
