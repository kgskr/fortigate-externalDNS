# More than one replica is only allowed with leaderElection.enabled=true; the
# render fails otherwise (the FortiGate DNS database admits a single writer).
replicaCount: 1

# Kubernetes scheduling priority for the controller pod (optional).
priorityClassName: ""

# Optional PodDisruptionBudget. Only valid with replicaCount > 1 and
# leaderElection.enabled=true (rendering fails otherwise). Set maxUnavailable
# (which then takes precedence) or minAvailable.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

image:
  repository: ghcr.io/kgskr/fortigate-external-dns
  # Image tag. Empty means use the chart's appVersion, which the release workflow
  # sets to the git tag, so the chart and image stay in lockstep without a manual
  # edit per release. Override to pin a specific tag.
  tag: ""
  # Prefer pinning by immutable digest in production, e.g.
  #   digest: sha256:...
  # When set, digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  # Create all RBAC the controller needs (source read access AND, when
  # leaderElection.enabled, the leader-election Lease Role/RoleBinding). Setting
  # this to false means YOU must provide every one of those yourself — including
  # the coordination.k8s.io/leases get/create/update grant, or leader election
  # (enabled by default) will fail at runtime.
  create: true

sources:
  - service
  - ingress
  - gateway

namespaces: []
# Additional namespaces consulted only to resolve parent Gateway addresses for
# HTTPRoutes. Read-only lookup scope; does not expand ownership or cleanup.
gatewayTargetNamespaces: []
domainFilters: []
ownerID: fortigate-external-dns
defaultTTL: 300
# Dry-run is the DEFAULT: the controller logs planned changes but writes
# nothing to the FortiGate. Verify the plan and database exclusivity first,
# then set both fortigate.exclusiveZoneOwnership=true and dryRun=false.
dryRun: true
# once=true renders a batch/v1 Job (restartPolicy Never, backoffLimit 0, no
# probes, named with the Helm revision) instead of a Deployment. The Job runs
# exactly one reconcile without leader election; do not run it alongside a
# Deployment release that writes to the same FortiGate DNS database.
once: false
interval: 1m
reconcileTimeout: 2m
cleanupPolicy: delete
# Mass-cleanup guard. A cycle whose successful discovery finds zero desired
# endpoints refuses cleanup (it is the signature of a wrong domain filter or
# namespace); set allowEmptyDesiredCleanup=true only for intentional
# decommissioning. maxCleanupPerCycle (0 = unlimited) additionally bounds how
# many delete/deactivate operations one cycle may apply.
allowEmptyDesiredCleanup: false
maxCleanupPerCycle: 0

# Log output format (text or json) and level (debug, info, warn, error).
logFormat: text
logLevel: info

# Liveness heartbeat window: /healthz fails when the reconciling replica
# completes no attempt within it. Empty derives max(5*interval, 5m) in the
# controller. Duration string, e.g. "10m".
healthzMaxStaleness: ""

leaderElection:
  enabled: true
  # Lease name. Defaults to the chart fullname when empty.
  id: ""
  # Namespace for the leader election Lease. Defaults to the release namespace.
  namespace: ""

metrics:
  # Gates scrape EXPOSURE only (the metrics Service and its NetworkPolicy).
  # The probe/metrics HTTP server itself always runs on `port`, and the
  # liveness/readiness probes are always rendered, so disabling metrics never
  # disables health probing.
  enabled: true
  # Container port serving /healthz, /readyz, and /metrics.
  port: 8080
  # Optional ClusterIP Service exposing the metrics port so Prometheus can scrape
  # it. Disabled by default so existing installs are unchanged.
  service:
    enabled: false
    annotations: {}
  # Optional NetworkPolicy restricting ingress to the controller pod. With
  # enabled=true and an empty allowedNamespaces list this denies all ingress
  # (deny-by-default); add namespace label selectors to allow specific scrapers
  # (for example the monitoring namespace).
  #
  # WARNING: liveness/readiness probes hit the metrics port from the kubelet
  # (node), not from a pod, so no namespaceSelector admits them. On CNIs that
  # enforce node->pod ingress this policy can block the probes and CrashLoop the
  # pod. Only enable it if your CNI permits local-node health-check traffic (most
  # managed CNIs do), or add an ipBlock rule for the node/pod CIDR. Leave disabled
  # if unsure — the metrics endpoint exposes only counters, no secrets.
  networkPolicy:
    enabled: false
    allowedNamespaces: []
    # - kubernetes.io/metadata.name: monitoring

fortigate:
  url: ""
  zone: ""
  vdom: root
  existingSecret: ""
  apiTokenSecretKey: api-token
  # Required acknowledgement before write mode can be enabled. Set true only
  # after confirming this entire FortiGate DNS database is managed exclusively
  # by this controller; shared/manual records are not supported in this mode.
  exclusiveZoneOwnership: false
  insecureSkipVerify: false
  # PEM CA bundle (inline) used instead of system roots to verify the
  # FortiGate TLS certificate — the right way to trust a private-CA device
  # without insecureSkipVerify. Rendered into a ConfigMap and mounted
  # read-only; mutually exclusive with insecureSkipVerify.
  # caBundle: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  caBundle: ""
  timeout: 15s
  retries: 2

# Opt-in egress NetworkPolicy: denies all egress from the controller pod
# except DNS resolution, the Kubernetes API, and the FortiGate endpoint(s). The
# pod holds a firewall-admin token, so bounding where it can connect is
# recommended once you know your cluster's addresses. Every enabled destination
# requires an explicit peer; NetworkPolicy cannot safely infer these peers.
#
# IMPORTANT: most CNIs evaluate egress AFTER Service DNAT, so a Service
# ClusterIP (for example 10.96.0.1 for kubernetes.default or 10.96.0.10 for
# kube-dns) in an ipBlock does NOT match. Use the API server's real endpoint
# IPs (`kubectl get endpoints kubernetes`) for kubeAPI, and the namespace/pod
# selector form for cluster DNS.
egressNetworkPolicy:
  enabled: false
  fortigate:
    # CIDR of the FortiGate management address, e.g. 203.0.113.10/32.
    cidr: ""
    # List form for multi-target mode with several FortiGates. Merged with
    # `cidr`; at least one of the two is required.
    cidrs: []
    port: 443
    # Optional port list; when non-empty it replaces `port`.
    ports: []
  kubeAPI:
    # Kubernetes API endpoint CIDR (the endpoint IP, not the ClusterIP), e.g.
    # 192.0.2.10/32. `cidrs` is merged with it. One of the two is required.
    cidr: ""
    cidrs: []
    ports:
      - 443
      - 6443
  dns:
    # Allow UDP/TCP 53. Provide a resolver ipBlock (cidr/cidrs) and/or the
    # selector form below; disable this rule when URL resolution is unnecessary.
    enabled: true
    cidr: ""
    cidrs: []
    # Selector form for in-cluster DNS (preferred over an ipBlock), e.g.
    #   namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    #   podSelector: {matchLabels: {k8s-app: kube-dns}}
    # When both are set they must match the same peer (AND semantics).
    namespaceSelector: {}
    podSelector: {}

# Opt-in platform resources and runtime. These values remain disabled by
# default; target mode replaces the direct FortiGate flags and Secret env value
# with namespaced CRD references resolved only in controller memory.
platform:
  targetMode:
    enabled: false
    # Optional chart-managed FortiGateDNSTarget resources. API tokens and CA
    # material are referenced by name/key and are never embedded in values.
    targets: []
    # Explicit resource-name allowlists used to generate get-only credential
    # RBAC in the release namespace.
    apiTokenSecretNames: []
    caSecretNames: []
    caConfigMapNames: []
  sharedOwnership:
    enabled: false
  planApproval:
    enabled: false
    retention: 20
  policy:
    enabled: false
    policies: []
  events:
    enabled: false
    debounce: 2s
    resync: 1m
  sourceExpansion:
    externalName:
      enabled: false
    headless:
      enabled: false
  status:
    enabled: false
    retention: 20

monitoring:
  # Optional prometheus-operator ServiceMonitor scraping the metrics Service.
  # Requires metrics.enabled=true and metrics.service.enabled=true (the
  # ServiceMonitor selects that Service) and the monitoring.coreos.com CRDs.
  serviceMonitor:
    enabled: false
    # Namespace for the ServiceMonitor; defaults to the release namespace.
    namespace: ""
    # Labels your Prometheus selects on (for kube-prometheus-stack, usually
    # `release: kube-prometheus-stack`).
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
# Passed through verbatim to the pod spec; include your own labelSelector, e.g.
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: fortigate-external-dns
topologySpreadConstraints: []

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
