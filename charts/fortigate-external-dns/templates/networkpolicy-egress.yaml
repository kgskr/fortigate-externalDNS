{{- if .Values.egressNetworkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-egress
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fortigate-external-dns.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  # Deny-by-default egress with an allowlist: the controller pod holds a
  # firewall-admin token, so it may reach only DNS, the Kubernetes API, and the
  # FortiGate management endpoint.
  egress:
    {{- if .Values.egressNetworkPolicy.dns.enabled }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    - {{- if .Values.egressNetworkPolicy.kubeAPI.cidr }}
      to:
        - ipBlock:
            cidr: {{ .Values.egressNetworkPolicy.kubeAPI.cidr }}
      {{- end }}
      ports:
        {{- range .Values.egressNetworkPolicy.kubeAPI.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - ipBlock:
            cidr: {{ required "egressNetworkPolicy.fortigate.cidr is required when the egress policy is enabled (NetworkPolicy needs an IP block)" .Values.egressNetworkPolicy.fortigate.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.egressNetworkPolicy.fortigate.port }}
{{- end }}
