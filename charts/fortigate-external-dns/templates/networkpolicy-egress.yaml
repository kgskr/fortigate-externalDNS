{{- if .Values.egressNetworkPolicy.enabled }}
{{- $egress := .Values.egressNetworkPolicy }}
{{- /* The legacy single `cidr` and the list form `cidrs` are merged, so existing values keep working. */}}
{{- $fortigateCIDRs := without (uniq (concat (list $egress.fortigate.cidr) ($egress.fortigate.cidrs | default list))) "" }}
{{- $fortigatePorts := $egress.fortigate.ports | default (list $egress.fortigate.port) }}
{{- $kubeAPICIDRs := without (uniq (concat (list $egress.kubeAPI.cidr) ($egress.kubeAPI.cidrs | default list))) "" }}
{{- $dnsCIDRs := without (uniq (concat (list $egress.dns.cidr) ($egress.dns.cidrs | default list))) "" }}
{{- $dnsSelector := or $egress.dns.namespaceSelector $egress.dns.podSelector }}
{{- if not $fortigateCIDRs }}
{{- fail "egressNetworkPolicy.fortigate.cidr or egressNetworkPolicy.fortigate.cidrs is required when the egress policy is enabled (NetworkPolicy needs an IP block per FortiGate)" }}
{{- end }}
{{- if not $kubeAPICIDRs }}
{{- fail "egressNetworkPolicy.kubeAPI.cidr or egressNetworkPolicy.kubeAPI.cidrs is required when the egress policy is enabled" }}
{{- end }}
{{- if and $egress.dns.enabled (not $dnsCIDRs) (not $dnsSelector) }}
{{- fail "egressNetworkPolicy.dns.cidr(s) or dns.namespaceSelector/podSelector is required when DNS egress is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-egress
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fortigate-external-dns.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  # Deny-by-default egress with an allowlist: the controller pod holds a
  # firewall-admin token, so it may reach only DNS, the Kubernetes API, and the
  # FortiGate management endpoint(s).
  egress:
    {{- if $egress.dns.enabled }}
    - to:
        {{- if $dnsSelector }}
        - {{- with $egress.dns.namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $egress.dns.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range $dnsCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    - to:
        {{- range $kubeAPICIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $egress.kubeAPI.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- range $fortigateCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $fortigatePorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
