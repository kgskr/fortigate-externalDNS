{{- if .Values.rbac.create -}}
{{- if .Values.namespaces }}
{{- range $namespace := .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fortigate-external-dns.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" $ | nindent 4 }}
rules:
  {{- if has "service" $.Values.sources }}
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"{{ if $.Values.platform.events.enabled }}, "watch"{{ end }}]
  {{- if $.Values.platform.sourceExpansion.headless.enabled }}
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- end }}
  {{- if has "ingress" $.Values.sources }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"{{ if $.Values.platform.events.enabled }}, "watch"{{ end }}]
  {{- end }}
  {{- if has "gateway" $.Values.sources }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list"{{ if $.Values.platform.events.enabled }}, "watch"{{ end }}]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fortigate-external-dns.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fortigate-external-dns.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fortigate-external-dns.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
rules:
  {{- if has "service" .Values.sources }}
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"{{ if .Values.platform.events.enabled }}, "watch"{{ end }}]
  {{- if .Values.platform.sourceExpansion.headless.enabled }}
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- end }}
  {{- if has "ingress" .Values.sources }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"{{ if .Values.platform.events.enabled }}, "watch"{{ end }}]
  {{- end }}
  {{- if has "gateway" .Values.sources }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list"{{ if .Values.platform.events.enabled }}, "watch"{{ end }}]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fortigate-external-dns.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fortigate-external-dns.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.namespaces (has "gateway" .Values.sources) .Values.gatewayTargetNamespaces }}
{{- range $namespace := .Values.gatewayTargetNamespaces }}
---
# Gateway target-lookup namespaces are read only to resolve parent Gateway
# addresses for HTTPRoutes in the source namespaces; in namespaced mode they need
# their own read grant or the gateway source fails with a forbidden error. Only
# gateways are listed here — HTTPRoutes are read in the source namespaces only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fortigate-external-dns.fullname" $ }}-gateway-target
  namespace: {{ $namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list"{{ if $.Values.platform.events.enabled }}, "watch"{{ end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fortigate-external-dns.fullname" $ }}-gateway-target
  namespace: {{ $namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fortigate-external-dns.fullname" $ }}-gateway-target
subjects:
  - kind: ServiceAccount
    name: {{ include "fortigate-external-dns.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- $platformRBAC := or .Values.platform.targetMode.enabled .Values.platform.sharedOwnership.enabled .Values.platform.planApproval.enabled .Values.platform.policy.enabled .Values.platform.events.enabled .Values.platform.status.enabled }}
{{- if $platformRBAC }}
---
# Platform CRDs are namespaced to the controller namespace. Source reads remain
# in the source Roles/ClusterRole above; credential reads are resourceName-bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
rules:
  {{- if .Values.platform.targetMode.enabled }}
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednstargets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednstargets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednstargets/finalizers"]
    verbs: ["update"]
  {{- $secretNames := uniq (concat .Values.platform.targetMode.apiTokenSecretNames .Values.platform.targetMode.caSecretNames) }}
  {{- if $secretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $secretNames | nindent 6 }}
    verbs: ["get"]
  {{- end }}
  {{- with .Values.platform.targetMode.caConfigMapNames }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["get"]
  {{- end }}
  {{- end }}
  {{- if .Values.platform.sharedOwnership.enabled }}
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsrecordownerships"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsrecordownerships/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsrecordownerships/finalizers"]
    verbs: ["update"]
  {{- end }}
  {{- if .Values.platform.policy.enabled }}
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednspolicies"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.platform.planApproval.enabled }}
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednschangeplans"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednschangeplans/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednschangeplans/finalizers"]
    verbs: ["update"]
  {{- end }}
  {{- if .Values.platform.status.enabled }}
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsstatuses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsstatuses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsstatuses/finalizers"]
    verbs: ["update"]
  {{- end }}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fortigate-external-dns.fullname" . }}-platform
subjects:
  - kind: ServiceAccount
    name: {{ include "fortigate-external-dns.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-leader-election
  namespace: {{ .Values.leaderElection.namespace | default .Release.Namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
rules:
  # create cannot be restricted by resourceName; get/update are scoped to the
  # single lease this controller owns to bound blast radius if the token leaks.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["{{ .Values.leaderElection.id | default (include "fortigate-external-dns.fullname" .) }}"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-leader-election
  namespace: {{ .Values.leaderElection.namespace | default .Release.Namespace }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fortigate-external-dns.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "fortigate-external-dns.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
