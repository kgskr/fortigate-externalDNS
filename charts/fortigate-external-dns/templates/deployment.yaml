{{- /* dryRun and fortigate.* are direct-mode settings; target mode carries them per FortiGateDNSTarget. */ -}}
{{- if and (not .Values.platform.targetMode.enabled) (not .Values.dryRun) (not .Values.fortigate.exclusiveZoneOwnership) }}
{{- fail "fortigate.exclusiveZoneOwnership=true is required when dryRun=false; write mode manages the entire FortiGate DNS database" }}
{{- end }}
{{- /* The FortiGate DNS database admits exactly one writer. A one-shot Job (once=true) is a single pod, so replicaCount does not apply to it. */ -}}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) (not .Values.once) }}
{{- fail "replicaCount > 1 requires leaderElection.enabled=true; multiple writers against one exclusive FortiGate DNS database are unsafe" }}
{{- end }}
{{- if .Values.once }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* Job pod templates are immutable; the release revision in the name lets every helm upgrade create a fresh Job. */}}
  name: {{ printf "%s-r%d" (include "fortigate-external-dns.fullname" . | trunc 50 | trimSuffix "-") (int .Release.Revision) }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    {{- include "fortigate-external-dns.podTemplate" . | nindent 4 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fortigate-external-dns.selectorLabels" . | nindent 6 }}
  template:
    {{- include "fortigate-external-dns.podTemplate" . | nindent 4 }}
{{- end }}
