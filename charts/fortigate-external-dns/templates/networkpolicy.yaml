{{- if and .Values.metrics.enabled .Values.metrics.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fortigate-external-dns.fullname" . }}-metrics
  labels:
    {{- include "fortigate-external-dns.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fortigate-external-dns.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.metrics.networkPolicy.allowedNamespaces }}
  ingress:
    - from:
        {{- range $selector := .Values.metrics.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $selector | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
  {{- else }}
  # Deny-by-default: no source is permitted to reach the controller pod until
  # allowedNamespaces lists at least one scraper namespace selector.
  ingress: []
  {{- end }}
{{- end }}
