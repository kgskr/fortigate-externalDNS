# Optional platform/EndpointSlice RBAC patch for the default namespace. The raw
# deployment remains legacy-only and does not need these grants. Apply this file
# only together with explicitly enabled CRD/source-expansion runtime support.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fortigate-external-dns-platform
  namespace: default
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Verbs are exactly the client calls the controller makes; drop "watch" (and
  # the ownership/changeplan rules you do not use) when event-driven mode,
  # shared ownership, or plan approval are disabled. Target mode always writes
  # fortigatednsstatuses, so those rules are needed with targets alone.
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednstargets", "fortigatednspolicies"]
    verbs: ["get", "list", "watch"]
  # Claim delete is used after verified provider removal; claims carry the
  # ownership-protection finalizer, hence finalizers/update.
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsrecordownerships"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednschangeplans"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsstatuses"]
    verbs: ["get", "create"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsrecordownerships/status", "fortigatednschangeplans/status", "fortigatednsstatuses/status"]
    verbs: ["update"]
  - apiGroups: ["fortigate-external-dns.kgskr.io"]
    resources: ["fortigatednsrecordownerships/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["edge-fortigate-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["edge-fortigate-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fortigate-external-dns-platform
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fortigate-external-dns-platform
subjects:
  - kind: ServiceAccount
    name: fortigate-external-dns
    namespace: default
