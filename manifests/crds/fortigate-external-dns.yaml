apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fortigatednstargets.fortigate-external-dns.kgskr.io
spec:
  group: fortigate-external-dns.kgskr.io
  scope: Namespaced
  names:
    plural: fortigatednstargets
    singular: fortigatednstarget
    kind: FortiGateDNSTarget
    shortNames: [fgdt]
    categories: [fortigate-external-dns]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ownership
          type: string
          jsonPath: .spec.ownershipMode
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [url, zone, apiTokenSecretRef, ownershipMode, controllerID]
              properties:
                url:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  pattern: '^https://[^@/?#]+(?:/[^?#]*)?$'
                vdom: {type: string, default: root, minLength: 1, maxLength: 128}
                zone: {type: string, minLength: 1, maxLength: 253}
                apiTokenSecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'}
                    key: {type: string, minLength: 1, maxLength: 253}
                    optional: {type: boolean, enum: [false]}
                caRef:
                  type: object
                  required: [kind, name, key]
                  properties:
                    kind: {type: string, enum: [ConfigMap, Secret]}
                    name: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'}
                    key: {type: string, minLength: 1, maxLength: 253}
                insecureSkipVerify: {type: boolean, default: false}
                ownershipMode: {type: string, enum: [exclusive, shared]}
                controllerID: {type: string, minLength: 1, maxLength: 253}
                sources:
                  type: array
                  uniqueItems: true
                  maxItems: 3
                  items: {type: string, enum: [service, ingress, gateway]}
                namespaces:
                  type: array
                  uniqueItems: true
                  maxItems: 256
                  items: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                gatewayTargetNamespaces:
                  type: array
                  uniqueItems: true
                  maxItems: 256
                  items: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                domainFilters:
                  type: array
                  uniqueItems: true
                  maxItems: 256
                  items: {type: string, minLength: 1, maxLength: 253}
                cleanupPolicy: {type: string, enum: [delete, deactivate, keep], default: delete}
                dryRun: {type: boolean, default: true}
                approvalMode: {type: string, enum: [disabled, required], default: disabled}
                allowNonDestructiveOverlap: {type: boolean, default: false}
                interval: {type: string, pattern: '^[1-9][0-9]*(ns|us|µs|ms|s|m|h)([0-9]+(ns|us|µs|ms|s|m|h))*$'}
                debounce: {type: string, pattern: '^[1-9][0-9]*(ns|us|µs|ms|s|m|h)([0-9]+(ns|us|µs|ms|s|m|h))*$'}
                timeout: {type: string, pattern: '^[1-9][0-9]*(ns|us|µs|ms|s|m|h)([0-9]+(ns|us|µs|ms|s|m|h))*$'}
                retries: {type: integer, format: int32, minimum: 0, maximum: 10}
                defaultTTL: {type: integer, format: int64, minimum: 1, maximum: 604800}
                externalNameEnabled: {type: boolean, default: false}
                headlessEnabled: {type: boolean, default: false}
              x-kubernetes-validations:
                - rule: '!(has(self.caRef) && self.insecureSkipVerify)'
                  message: caRef and insecureSkipVerify are mutually exclusive
                - rule: 'self.ownershipMode != "shared" || self.cleanupPolicy == "keep" || size(self.namespaces) == 0'
                  message: namespace-restricted shared targets require cleanupPolicy keep
                - rule: 'self.zone == oldSelf.zone && ((!has(self.vdom) && !has(oldSelf.vdom)) || (has(self.vdom) && has(oldSelf.vdom) && self.vdom == oldSelf.vdom)) && self.controllerID == oldSelf.controllerID'
                  message: zone, vdom, and controllerID are immutable target identity fields
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64, minimum: 0}
                conditions:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type: {type: string, maxLength: 64}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string, maxLength: 64}
                      message: {type: string, maxLength: 1024}
---
