apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fortigatednsstatuses.fortigate-external-dns.kgskr.io
spec:
  group: fortigate-external-dns.kgskr.io
  scope: Namespaced
  names:
    plural: fortigatednsstatuses
    singular: fortigatednsstatus
    kind: FortiGateDNSStatus
    shortNames: [fgds]
    categories: [fortigate-external-dns]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Drift
          type: integer
          jsonPath: .status.counts.drift
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [targetRef]
              properties:
                targetRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'}
                retention: {type: integer, format: int32, minimum: 0, maximum: 100, default: 20}
              x-kubernetes-validations:
                - rule: 'self.targetRef == oldSelf.targetRef'
                  message: targetRef is immutable
            status:
              type: object
              properties:
                observedTargetGeneration: {type: integer, format: int64, minimum: 0}
                providerRevision: {type: string, maxLength: 256}
                counts:
                  type: object
                  properties:
                    desired: {type: integer, format: int32, minimum: 0}
                    current: {type: integer, format: int32, minimum: 0}
                    drift: {type: integer, format: int32, minimum: 0}
                    conflicts: {type: integer, format: int32, minimum: 0}
                lastPlanHash: {type: string, pattern: '^$|^[a-f0-9]{64}$'}
                lastAuditTime: {type: string, format: date-time}
                lastApplyTime: {type: string, format: date-time}
                conditions:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                        enum: [Ready, DiscoveryComplete, ProviderReachable, OwnershipHealthy, PolicyAccepted, PlanApproved, DriftFree]
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string, maxLength: 64}
                      message: {type: string, maxLength: 1024}
                history:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [planHash, phase, timestamp]
                    properties:
                      planHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                      phase: {type: string, enum: [PendingApproval, Approved, Applying, Succeeded, Failed, Stale, Interrupted]}
                      timestamp: {type: string, format: date-time}
                      counts:
                        type: object
                        properties:
                          desired: {type: integer, format: int32, minimum: 0}
                          current: {type: integer, format: int32, minimum: 0}
                          drift: {type: integer, format: int32, minimum: 0}
                          conflicts: {type: integer, format: int32, minimum: 0}
