apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fortigate-external-dns
  namespace: default
rules:
  # Headless Service publication is disabled in the raw legacy Deployment, so
  # EndpointSlice access is deliberately absent here. Apply and tailor
  # manifests/platform-rbac.yaml when that opt-in runtime feature is available.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fortigate-external-dns
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fortigate-external-dns
subjects:
  - kind: ServiceAccount
    name: fortigate-external-dns
    namespace: default
---
# Leader election Lease permissions (single-writer guard for multi-replica runs).
# NOTE: when changing the install namespace, update every "namespace: default"
# occurrence in this file together with --namespace and
# --leader-election-namespace in deployment.yaml, or source reads and leader
# election will not bind.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fortigate-external-dns-leader-election
  namespace: default
rules:
  # create cannot be restricted by resourceName; get/update are scoped to the
  # single lease this controller owns to bound blast radius if the token leaks.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["fortigate-external-dns"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fortigate-external-dns-leader-election
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fortigate-external-dns-leader-election
subjects:
  - kind: ServiceAccount
    name: fortigate-external-dns
    namespace: default
