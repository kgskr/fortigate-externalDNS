apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fortigate-external-dns
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fortigate-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fortigate-external-dns
subjects:
  - kind: ServiceAccount
    name: fortigate-external-dns
    namespace: default
---
# Leader election Lease permissions (single-writer guard for multi-replica runs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fortigate-external-dns-leader-election
  namespace: default
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fortigate-external-dns-leader-election
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fortigate-external-dns-leader-election
subjects:
  - kind: ServiceAccount
    name: fortigate-external-dns
    namespace: default
