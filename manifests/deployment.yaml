# Minimal reference manifest. The Helm chart (charts/fortigate-external-dns) is
# the authoritative, fully configurable deployment artifact; this plain manifest
# mirrors the chart's security and runtime defaults for quick installs without a
# templating tool. Replace the image and FortiGate settings before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortigate-external-dns
  namespace: default
  labels:
    app.kubernetes.io/name: fortigate-external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fortigate-external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortigate-external-dns
    spec:
      serviceAccountName: fortigate-external-dns
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Prefer pinning by immutable digest (…@sha256:…) in production.
          image: ghcr.io/kgskr/fortigate-external-dns:0.1.1
          args:
            - --provider=fortigate
            - --source=service
            - --source=ingress
            - --source=gateway
            - --namespace=default
            - --domain-filter=example.com
            - --owner-id=my-cluster
            - --cleanup-policy=delete
            - --interval=1m
            - --reconcile-timeout=2m
            - --metrics-addr=:8080
            - --leader-election
            - --leader-election-id=fortigate-external-dns
            - --leader-election-namespace=default
            - --fortigate-url=https://fortigate.example.com
            - --fortigate-zone=example.com
            - --fortigate-vdom=root
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FORTIGATE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fortigate-external-dns
                  key: api-token
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
