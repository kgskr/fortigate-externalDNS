apiVersion: v1
kind: Service
metadata:
  name: sample-web
  namespace: default
  annotations:
    external-dns.kubernetes.io/hostname: sample.example.com
    external-dns.kubernetes.io/ttl: "300"
spec:
  type: LoadBalancer
  selector:
    app: sample-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
