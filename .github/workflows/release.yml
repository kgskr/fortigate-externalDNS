name: Release

# Publishes the container image and Helm chart to GHCR when a GitHub Release is
# published. All publishing is gated on the CI validation workflow passing.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Guard ref
        run: |
          case "${{ github.ref }}" in
            refs/tags/v*) ;;
            *) echo "Release publishing requires a v* tag ref, got ${{ github.ref }}"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Compute image repository (lowercase owner)
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/fortigate-external-dns" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    runs-on: ubuntu-latest
    # Publish the chart only after the image is confirmed pushed (which itself
    # requires validate to pass), so the chart never advertises an image tag that
    # failed to publish.
    needs: image
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Package and push Helm chart to GHCR (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm package ./charts/fortigate-external-dns --version "$version" --app-version "$version"
          helm push "fortigate-external-dns-${version}.tgz" "oci://ghcr.io/${owner}/charts"
