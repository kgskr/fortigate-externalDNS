name: CI

# Runs on pull requests, and is called as a reusable workflow by release.yml so a
# release is gated on the same validation (main pushes are validated there rather
# than duplicating a push trigger here).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: secret scan
        run: sh scripts/secret-scan.sh

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: helm lint & template (default + existing-secret scenarios)
        run: sh scripts/helm-template-check.sh
