name: CI

# Runs on pull requests and main pushes, and is called as a reusable workflow by
# release.yml so release publishing is gated on the same validation.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: secret scan
        run: sh scripts/secret-scan.sh

      - name: secret scan regression tests
        run: sh scripts/secret-scan_test.sh

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: helm lint & template (default + existing-secret scenarios)
        run: sh scripts/helm-template-check.sh
